name: Build TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Python Builder
        run: python build_apk.py

      - name: Zip Output
        run: |
          cd android_project
          zip -r ../TurovFy-Android-Source.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: TurovFy-Android-Source.zip
