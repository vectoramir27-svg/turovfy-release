name: Build TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder CLI locally
        run: npm install @pwabuilder/cli

      - name: Run Build Script
        run: node build.js

      - name: Archive Android Output
        run: |
          cd android-output
          zip -r ../android-app.zip .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: android-app.zip
