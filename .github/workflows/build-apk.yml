name: Build TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Native Android Project
        run: |
          mkdir -p my-app/app/src/main/java/com/turovfy/app
          mkdir -p my-app/app/src/main/res/values
          mkdir -p my-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p my-app/app/src/main/res/mipmap-hdpi

          # Иконка приложения
          curl -s -L "https://turovfy-app.onrender.com/assets/logo.png" -o my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png my-app/app/src/main/res/mipmap-hdpi/ic_launcher.png

          # gradle.properties
          cat << 'EOF' > my-app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.turovfy.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="TurovFy"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java: аппаратный WebView + фикс попапов авторизации
          cat << 'EOF' > my-app/app/src/main/java/com/turovfy/app/MainActivity.java
          package com.turovfy.app;

          import android.app.Activity;
          import android.app.Dialog;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.KeyEvent;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  
                  // Запрещаем мобильный зум и ресайз страницы
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  // Включаем поддержку модальных окон для Google Login
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);

                  // Полный десктопный UA, чтобы Google не понимал, что это WebView
                  s.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36");

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient());
                  
                  // Перехват всплывающих окон авторизации внутри приложения
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView newWebView = new WebView(MainActivity.this);
                          WebSettings newSettings = newWebView.getSettings();
                          newSettings.setJavaScriptEnabled(true);
                          newSettings.setDomStorageEnabled(true);
                          newSettings.setUserAgentString(s.getUserAgentString());

                          CookieManager.getInstance().setAcceptThirdPartyCookies(newWebView, true);

                          Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                          dialog.setContentView(newWebView, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, 
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          dialog.show();

                          newWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView v, String url) {
                                  super.onPageFinished(v, url);
                                  // Если вернулись на страницу приложения после входа — закрываем попап
                                  if (url.contains("turovfy-app.onrender.com")) {
                                      dialog.dismiss();
                                      webView.reload();
                                  }
                              }
                          });

                          newWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  dialog.dismiss();
                              }
                          });

                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(newWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  webView.loadUrl("https://turovfy-app.onrender.com/");
                  setContentView(webView);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  // Не глушим WebView в фоне, сохраняя воспроизведение
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

          # strings.xml
          cat << 'EOF' > my-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">TurovFy</string>
          </resources>
          EOF

          # build.gradle (project)
          cat << 'EOF' > my-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.google.com' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          echo "include ':app'" > my-app/settings.gradle

          # build.gradle (app)
          cat << 'EOF' > my-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.turovfy.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.turovfy.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd my-app
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: my-app/app/build/outputs/apk/debug/app-debug.apk
