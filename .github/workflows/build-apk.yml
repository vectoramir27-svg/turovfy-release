name: Build Android APK (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          # Будим спящий Render и ждем ответа 200 OK
          echo "Ожидание пробуждения Render..."
          until [ \$(curl -s -o /dev/null -w "%{http_code}" https://turovfy-app.onrender.com/manifest.json) -eq 200 ]; do
            echo "Render еще спит, ждем 5 секунд..."
            sleep 5
          done
          echo "Render активен и отдает manifest.json!"

          mkdir build-twa && cd build-twa

          # Генерируем ключ для подписи
          keytool -genkeypair -v -keystore android.keystore -alias turovfy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "turovfy123" -keypass "turovfy123" \
            -dname "CN=TurovFy, OU=Mobile, O=Turov, L=Moscow, S=Moscow, C=RU"

          # Инициализируем проект с живого сайта
          bubblewrap init --manifest="https://turovfy-app.onrender.com/manifest.json" --skipQuestions

          # Пароли подписи для Bubblewrap
          export BUBBLEWRAP_KEYSTORE_PASSWORD="turovfy123"
          export BUBBLEWRAP_KEY_PASSWORD="turovfy123"

          # Сборка готового APK
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Release-APK
          path: build-twa/*.apk
