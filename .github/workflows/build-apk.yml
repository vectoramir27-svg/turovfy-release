name: Build Android APK (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          # Запускаем локальный веб-сервер для отдачи манифеста
          python3 -m http.server 8080 &
          SERVER_PID=$!
          sleep 2

          mkdir build-twa && cd build-twa

          # Генерируем ключ для подписи
          keytool -genkeypair -v -keystore android.keystore -alias turovfy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "turovfy123" -keypass "turovfy123" \
            -dname "CN=TurovFy, OU=Mobile, O=Turov, L=Moscow, S=Moscow, C=RU"

          # Инициализируем проект через локальный URL
          bubblewrap init --manifest="http://localhost:8080/manifest.json" --skipQuestions

          # Останавливаем временный веб-сервер
          kill $SERVER_PID || true

          # Подменяем локальный хост на боевой домен Render
          sed -i 's/localhost:8080/turovfy-app.onrender.com/g' twa-manifest.json
          sed -i 's/http:\/\/turovfy-app.onrender.com/https:\/\/turovfy-app.onrender.com/g' twa-manifest.json

          # Задаем пароли для автоматической сборки
          export BUBBLEWRAP_KEYSTORE_PASSWORD="turovfy123"
          export BUBBLEWRAP_KEY_PASSWORD="turovfy123"

          # Собираем релизный APK
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Release-APK
          path: build-twa/*.apk
