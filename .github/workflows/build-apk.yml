name: Build Standalone TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Prepare Android App
        run: |
          mkdir -p my-app/app/src/main/java/com/turovfy/app
          mkdir -p my-app/app/src/main/res/values
          mkdir -p my-app/app/src/main/res/mipmap-hdpi
          mkdir -p my-app/app/src/main/res/mipmap-xxxhdpi

          # Копируем логотип в иконки приложения
          if [ -f "assets/logo.png" ]; then
            cp assets/logo.png my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp assets/logo.png my-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

          # gradle.properties
          cat << 'EOF' > my-app/gradle.properties
          android.useAndroidX=false
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.turovfy.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar">

                  <service
                      android:name=".AudioPlayerService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # AudioPlayerService.java: полноценная MediaSession со скачиванием обложки и обновлением шторки One UI
          cat << 'EOF' > my-app/app/src/main/java/com/turovfy/app/AudioPlayerService.java
          package com.turovfy.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class AudioPlayerService extends Service {
              public static AudioPlayerService instance;
              private PowerManager.WakeLock wakeLock;
              private MediaSession mediaSession;
              private NotificationManager notificationManager;
              private final String CHANNEL_ID = "turovfy_playback";
              private String currentTitle = "TurovFy";
              private String currentArtist = "Ожидание выбора";
              private Bitmap currentCover = null;
              private boolean isPlaying = true;

              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TurovFy::BgPlay");
                      wakeLock.acquire();
                  }

                  notificationManager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && notificationManager != null) {
                      NotificationChannel chan = new NotificationChannel(
                          CHANNEL_ID, "TurovFy Playback", NotificationManager.IMPORTANCE_LOW);
                      notificationManager.createNotificationChannel(chan);
                  }

                  mediaSession = new MediaSession(this, "TurovFySession");
                  mediaSession.setCallback(new MediaSession.Callback() {
                      @Override
                      public void onPlay() { MainActivity.triggerJs("togglePlay()"); }
                      @Override
                      public void onPause() { MainActivity.triggerJs("togglePlay()"); }
                      @Override
                      public void onSkipToNext() { MainActivity.triggerJs("nextTrack()"); }
                      @Override
                      public void onSkipToPrevious() { MainActivity.triggerJs("prevTrack()"); }
                  });

                  updatePlaybackState(true);
                  mediaSession.setActive(true);

                  startForeground(101, buildNotification());
              }

              public void updatePlaybackState(boolean playing) {
                  this.isPlaying = playing;
                  long state = playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED;
                  PlaybackState.Builder stateBuilder = new PlaybackState.Builder()
                      .setActions(PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE |
                                  PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS)
                      .setState(state, PlaybackState.PLAYBACK_POSITION_UNKNOWN, 1.0f);
                  mediaSession.setPlaybackState(stateBuilder.build());

                  if (notificationManager != null) {
                      notificationManager.notify(101, buildNotification());
                  }
              }

              public void updateTrackInfo(final String title, final String artist, final String coverUrl) {
                  this.currentTitle = title;
                  this.currentArtist = artist;

                  new Thread(() -> {
                      Bitmap bitmap = null;
                      if (coverUrl != null && !coverUrl.isEmpty()) {
                          try {
                              URL url = new URL(coverUrl);
                              HttpURLConnection connection = (HttpURLConnection) url.openConnection();
                              connection.setDoInput(true);
                              connection.setConnectTimeout(4000);
                              connection.setReadTimeout(4000);
                              connection.connect();
                              InputStream input = connection.getInputStream();
                              bitmap = BitmapFactory.decodeStream(input);
                          } catch (Exception ignored) {}
                      }
                      this.currentCover = bitmap;

                      MediaMetadata.Builder metaBuilder = new MediaMetadata.Builder()
                          .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                          .putString(MediaMetadata.METADATA_KEY_ARTIST, artist)
                          .putString(MediaMetadata.METADATA_KEY_ALBUM, "TurovFy");

                      if (bitmap != null) {
                          metaBuilder.putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, bitmap);
                          metaBuilder.putBitmap(MediaMetadata.METADATA_KEY_ART, bitmap);
                      }
                      mediaSession.setMetadata(metaBuilder.build());

                      if (notificationManager != null) {
                          notificationManager.notify(101, buildNotification());
                      }
                  }).start();
              }

              private Notification buildNotification() {
                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, openIntent,
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  Notification.Builder builder;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  Notification.MediaStyle style = new Notification.MediaStyle();
                  style.setMediaSession(mediaSession.getSessionToken());

                  builder.setContentTitle(currentTitle)
                         .setContentText(currentArtist)
                         .setSmallIcon(R.mipmap.ic_launcher)
                         .setContentIntent(pi)
                         .setStyle(style)
                         .setVisibility(Notification.VISIBILITY_PUBLIC);

                  if (currentCover != null) {
                      builder.setLargeIcon(currentCover);
                  }
                  return builder.build();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  if (mediaSession != null) {
                      mediaSession.setActive(false);
                      mediaSession.release();
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # MainActivity.java: аппаратный кэш + нативный JS-интерфейс + бесшовный вход Google
          cat << 'EOF' > my-app/app/src/main/java/com/turovfy/app/MainActivity.java
          package com.turovfy.app;

          import android.app.Activity;
          import android.app.Dialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Message;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static WebView instanceWebView;
              private WebView webView;

              public static void triggerJs(final String script) {
                  if (instanceWebView != null) {
                      instanceWebView.post(() -> instanceWebView.evaluateJavascript(script, null));
                  }
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void updateMetadata(String title, String artist, String coverUrl) {
                      if (AudioPlayerService.instance != null) {
                          AudioPlayerService.instance.updateTrackInfo(title, artist, coverUrl);
                      }
                  }

                  @JavascriptInterface
                  public void setPlaybackState(boolean playing) {
                      if (AudioPlayerService.instance != null) {
                          AudioPlayerService.instance.updatePlaybackState(playing);
                      }
                  }

                  @JavascriptInterface
                  public void openExternalUrl(String url) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          intent.setPackage("com.android.chrome");
                          startActivity(intent);
                      } catch (Exception e) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          startActivity(intent);
                      }
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this) {
                      @Override
                      protected void onWindowVisibilityChanged(int visibility) {
                          super.onWindowVisibilityChanged(View.VISIBLE);
                      }
                  };
                  instanceWebView = webView;

                  Intent serviceIntent = new Intent(this, AudioPlayerService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  // Моментальная загрузка из кэша и аппаратное GPU-ускорение
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);

                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);

                  // Чистый мобильный Chrome User-Agent для корректной работы Google Auth
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36");

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          WebView popWebView = new WebView(MainActivity.this);
                          WebSettings popSettings = popWebView.getSettings();
                          popSettings.setJavaScriptEnabled(true);
                          popSettings.setDomStorageEnabled(true);
                          popSettings.setUserAgentString(s.getUserAgentString());

                          CookieManager.getInstance().setAcceptThirdPartyCookies(popWebView, true);

                          final Dialog authDialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                          authDialog.setContentView(popWebView, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, 
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          authDialog.show();

                          popWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView v, String url) {
                                  super.onPageFinished(v, url);
                                  if (url.contains("turovfy-app.onrender.com")) {
                                      authDialog.dismiss();
                                      CookieManager.getInstance().flush();
                                      webView.evaluateJavascript("checkExistingAuth();", null);
                                  }
                              }
                          });

                          popWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  authDialog.dismiss();
                                  CookieManager.getInstance().flush();
                                  webView.evaluateJavascript("checkExistingAuth();", null);
                              }
                          });

                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(popWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          view.evaluateJavascript(
                              "Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });" +
                              "Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });" +
                              "window.addEventListener('visibilitychange', (e) => e.stopImmediatePropagation(), true);",
                              null
                          );
                      }
                  });

                  webView.loadUrl("https://turovfy-app.onrender.com/");
                  setContentView(webView);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  CookieManager.getInstance().flush();
                  if (webView != null) {
                      webView.evaluateJavascript("checkExistingAuth();", null);
                  }
              }

              @Override
              protected void onPause() { super.onPause(); }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

          cat << 'EOF' > my-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">TurovFy</string>
          </resources>
          EOF

          cat << 'EOF' > my-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          echo "include ':app'" > my-app/settings.gradle

          cat << 'EOF' > my-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.turovfy.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.turovfy.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

      - name: Build APK with Gradle
        run: |
          cd my-app
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: my-app/app/build/outputs/apk/debug/app-debug.apk
