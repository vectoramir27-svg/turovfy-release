name: Build Android APK (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          # Ожидание готовности manifest.json на Render
          echo "Проверка готовности манифеста на сайте..."
          code="000"
          while [ "$code" != "200" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://turovfy-app.onrender.com/manifest.json)
            echo "HTTP статус: $code"
            if [ "$code" != "200" ]; then
              echo "Ждем деплой на Render (5 сек)..."
              sleep 5
            fi
          done
          echo "Манифест найден и готов!"

          mkdir build-twa && cd build-twa

          # Генерация ключа подписи
          keytool -genkeypair -v -keystore android.keystore -alias turovfy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "turovfy123" -keypass "turovfy123" \
            -dname "CN=TurovFy, OU=Mobile, O=Turov, L=Moscow, S=Moscow, C=RU"

          # Инициализация приложения
          bubblewrap init --manifest="https://turovfy-app.onrender.com/manifest.json" --skipQuestions

          # Пароли подписи
          export BUBBLEWRAP_KEYSTORE_PASSWORD="turovfy123"
          export BUBBLEWRAP_KEY_PASSWORD="turovfy123"

          # Сборка готового APK
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Release-APK
          path: build-twa/*.apk
