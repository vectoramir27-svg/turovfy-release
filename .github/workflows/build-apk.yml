- name: Generate Native Android Project
        run: |
          mkdir -p my-app/app/src/main/java/com/turovfy/app
          mkdir -p my-app/app/src/main/res/values
          mkdir -p my-app/app/src/main/res/mipmap-hdpi

          # AndroidManifest.xml
          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.turovfy.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="TurovFy"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java (WebView)
          cat << 'EOF' > my-app/app/src/main/java/com/turovfy/app/MainActivity.java
          package com.turovfy.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://turovfy-app.onrender.com/");
                  setContentView(webView);
              }
          }
          EOF

          # strings.xml
          cat << 'EOF' > my-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">TurovFy</string>
          </resources>
          EOF

          # build.gradle (project) - обновлено под Gradle 9+
          cat << 'EOF' > my-app/build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # settings.gradle
          echo "include ':app'" > my-app/settings.gradle

          # build.gradle (app)
          cat << 'EOF' > my-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.turovfy.app'
              compileSdk 33
              defaultConfig {
                  applicationId "com.turovfy.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
