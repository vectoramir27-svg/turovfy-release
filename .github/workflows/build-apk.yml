name: Build TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Generate Android App via CLI
        run: |
          pwa android generate --manifest https://turovfy-app.onrender.com/manifest.json --name "TurovFy" --packageId "com.turovfy.app.twa" --output ./android-output || true

      - name: Archive Android Output
        run: |
          mkdir -p android-output
          cd android-output
          zip -r ../android-app.zip .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: android-app.zip
