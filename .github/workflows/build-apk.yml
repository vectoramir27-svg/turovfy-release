name: Build Android APK (TWA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          mkdir build-twa && cd build-twa

          # Генерируем ключ подписи без парольных подсказок
          keytool -genkeypair -v -keystore android.keystore -alias turovfy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "turovfy123" -keypass "turovfy123" \
            -dname "CN=TurovFy, OU=Mobile, O=Turov, L=Moscow, S=Moscow, C=RU"

          # Формируем готовый конфиг проекта TWA напрямую с твоим логотипом
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.turovfy.app",
            "host": "turovfy-app.onrender.com",
            "name": "TurovFy",
            "launcherName": "TurovFy",
            "themeColor": "#050507",
            "navigationColor": "#050507",
            "backgroundColor": "#050507",
            "startUrl": "/",
            "iconUrl": "https://turovfy-app.onrender.com/assets/logo.png",
            "maskableIconUrl": "https://turovfy-app.onrender.com/assets/logo.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "signingKey": {
              "path": "./android.keystore",
              "alias": "turovfy"
            },
            "enableNotifications": false,
            "features": {
              "locationDelegation": {
                "enabled": false
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": "NONE",
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://turovfy-app.onrender.com/",
            "shareTarget": {
              "enabled": false
            }
          }
          EOF

          # Сборка проекта без интерактивных запросов
          export BUBBLEWRAP_KEYSTORE_PASSWORD="turovfy123"
          export BUBBLEWRAP_KEY_PASSWORD="turovfy123"
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Release-APK
          path: build-twa/*.apk
