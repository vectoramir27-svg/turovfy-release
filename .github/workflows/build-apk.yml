name: Build TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Native TWA Android Project
        run: |
          mkdir -p my-app/app/src/main/java/com/turovfy/app
          mkdir -p my-app/app/src/main/res/values
          mkdir -p my-app/app/src/main/res/mipmap-xxxhdpi
          mkdir -p my-app/app/src/main/res/mipmap-hdpi

          # Скачиваем иконку приложения
          curl -s -L "https://turovfy-app.onrender.com/assets/logo.png" -o my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png my-app/app/src/main/res/mipmap-hdpi/ic_launcher.png

          # gradle.properties
          cat << 'EOF' > my-app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # AndroidManifest.xml с декларацией Trusted Web Activity
          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.turovfy.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/app_name">

                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://turovfy-app.onrender.com/" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/colorPrimary" />

                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/colorPrimary" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="turovfy-app.onrender.com" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml & colors.xml
          cat << 'EOF' > my-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">TurovFy</string>
          </resources>
          EOF

          cat << 'EOF' > my-app/app/src/main/res/values/colors.xml
          <resources>
              <color name="colorPrimary">#050507</color>
          </resources>
          EOF

          # build.gradle (project)
          cat << 'EOF' > my-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.google.com' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.google.com' }
              }
          }
          EOF

          echo "include ':app'" > my-app/settings.gradle

          # build.gradle (app) с подключением официального движка AndroidBrowserHelper
          cat << 'EOF' > my-app/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.turovfy.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.turovfy.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd my-app
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: my-app/app/build/outputs/apk/debug/app-debug.apk
