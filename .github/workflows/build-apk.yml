name: Build TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        id: java
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Bypass Interactive Prompts
        env:
          JAVA_PATH: ${{ steps.java.outputs.path }}
          ANDROID_PATH: ${{ env.ANDROID_HOME }}
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_PATH\",\"androidSdkPath\":\"$ANDROID_PATH\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Generate and Build APK
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
        run: |
          bubblewrap update --manifest https://turovfy-app.onrender.com/manifest.json || true
          bubblewrap build --manifest twa-manifest.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: '*.apk'
