name: Build Standalone TurovFy APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Prepare Standalone Android App
        run: |
          mkdir -p my-app/app/src/main/java/com/turovfy/app
          mkdir -p my-app/app/src/main/assets
          mkdir -p my-app/app/src/main/res/values
          mkdir -p my-app/app/src/main/res/mipmap-hdpi
          mkdir -p my-app/app/src/main/res/mipmap-xxxhdpi

          # Копируем локальный интерфейс в сборку APK
          if [ -f "index.html" ]; then
            cp index.html my-app/app/src/main/assets/
          fi
          if [ -d "assets" ]; then
            cp -r assets/* my-app/app/src/main/assets/
            if [ -f "assets/logo.png" ]; then
              cp assets/logo.png my-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp assets/logo.png my-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
            fi
          fi

          # gradle.properties
          cat << 'EOF' > my-app/gradle.properties
          android.useAndroidX=false
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > my-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.turovfy.app">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar">

                  <service
                      android:name=".AudioPlayerService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Фоновый сервис на системных вызовах без AndroidX
          cat << 'EOF' > my-app/app/src/main/java/com/turovfy/app/AudioPlayerService.java
          package com.turovfy.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class AudioPlayerService extends Service {
              private PowerManager.WakeLock wakeLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "TurovFy::BgPlay");
                      wakeLock.acquire();
                  }

                  String channelId = "turovfy_channel";
                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel chan = new NotificationChannel(
                          channelId, "TurovFy Playback", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(chan);
                      builder = new Notification.Builder(this, channelId);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  Notification notification = builder
                      .setContentTitle("TurovFy")
                      .setContentText("Музыка играет в фоне")
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .build();

                  startForeground(101, notification);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          # MainActivity.java на чистом Android SDK
          cat << 'EOF' > my-app/app/src/main/java/com/turovfy/app/MainActivity.java
          package com.turovfy.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);

                  Intent serviceIntent = new Intent(this, AudioPlayerService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);

                  s.setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36");

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.contains("accounts.google.com")) {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.setPackage("com.android.chrome");
                              try {
                                  startActivity(intent);
                                  return true;
                              } catch (Exception e) {
                                  intent.setPackage(null);
                                  try {
                                      startActivity(intent);
                                      return true;
                                  } catch (Exception ex) {
                                      return false;
                                  }
                              }
                          }
                          return false;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              protected void onPause() {
                  super.onPause();
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && webView.canGoBack()) {
                      webView.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

          cat << 'EOF' > my-app/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">TurovFy</string>
          </resources>
          EOF

          # build.gradle (project)
          cat << 'EOF' > my-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.google.com' }
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://maven.google.com' }
              }
          }
          EOF

          echo "include ':app'" > my-app/settings.gradle

          # build.gradle (app) без внешних зависимостей
          cat << 'EOF' > my-app/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.turovfy.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.turovfy.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

      - name: Build APK with Gradle
        run: |
          cd my-app
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurovFy-Android-App
          path: my-app/app/build/outputs/apk/debug/app-debug.apk
